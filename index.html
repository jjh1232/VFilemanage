<!DOCTYPE html>
<html>
<head>
  <!-- blob: 은 음악 앨범아트용. 태그에서 꺼낸 그림 바이트를 Blob으로 만들어 캔버스에 그리는데,
       이게 없으면 img가 CSP에 막혀서 조용히 로드실패로만 끝남 -->
  <meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline' 'unsafe-eval';
               img-src 'self' data: blob: appfile: thumb:;
               media-src 'self' appfile:;">
               
  <title>VFilemanage</title>
    <style>
    /* height 100% 체인 필수! */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body, #root {
      height: 100%;  /* 이거 없으면 100% 동작 안함 */
      width: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./src/index.js"></script>
</body>
</html>
